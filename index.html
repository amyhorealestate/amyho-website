<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amy Ho｜房產觀測站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+TC:wght@300;400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:        #1a1714;
      --paper:      #f5f0e8;
      --warm-mid:   #c8b89a;
      --accent:     #8b6f47;
      --muted:      #7a6e63;
      --line:       rgba(139, 111, 71, 0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', 'Noto Serif TC', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 導覽列 */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 1000; /* 提高層級 */
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 2rem;
      background: rgba(245, 240, 232, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    /* 選單預設必須隱藏在螢幕右側外 (translateX 100%) */
    .nav-menu {
      position: fixed; top: 0; right: 0;
      width: min(320px, 85vw); height: 100dvh;
      background: var(--ink);
      padding: 6rem 2.5rem;
      transform: translateX(100%); 
      transition: transform 0.4s ease;
      z-index: 1001;
      display: flex; flex-direction: column; gap: 2rem;
    }
    .nav-menu.open { transform: translateX(0); }

    .nav-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      opacity: 0; pointer-events: none;
      z-index: 1000;
      transition: opacity 0.3s;
    }
    .nav-overlay.open { opacity: 1; pointer-events: auto; }

    /* 標題區域：增加 padding-top 確保不被遮住 */
    header {
      padding: 12rem 2rem 4rem; /* 從 8rem 增加到 12rem */
      max-width: 900px; margin: 0 auto;
      text-align: left;
    }

    .hero-name { font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 8vw, 6rem); font-weight: 300; margin-bottom: 0.5rem; }
    .hero-bio { line-height: 2; color: var(--muted); max-width: 600px; }

    /* 按鈕樣式 */
    .article-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 900px; margin: 0 auto; }
    .article-card { border: 1px solid var(--line); padding: 2rem; text-decoration: none; color: inherit; display: block; transition: 0.3s; }
    .article-card:hover { border-color: var(--accent); background: #fff; }

    @media (max-width: 480px) {
      header { padding: 10rem 1.25rem 3rem; }
      nav { padding: 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <span style="font-family: 'Cormorant Garamond', serif; font-weight: 600;">Amy Ho</span><br>
    <span style="font-size: 0.6rem; letter-spacing: 0.2em; color: var(--muted);">房產觀測站</span>
  </div>
  <button class="hamburger" id="menuBtn" style="background:none; border:none; cursor:pointer;">
    <div style="width:25px; height:2px; background:var(--ink); margin:4px 0;"></div>
    <div style="width:25px; height:2px; background:var(--ink); margin:4px 0;"></div>
    <div style="width:25px; height:2px; background:var(--ink); margin:4px 0;"></div>
  </button>
</nav>

<div class="nav-overlay" id="navOverlay"></div>
<div class="nav-menu" id="navMenu">
  <a href="#" style="color:white; text-decoration:none; font-size:1.5rem;">首頁</a>
  <a href="/articles-tw" style="color:white; text-decoration:none; font-size:1.5rem;">繁體文章</a>
  <a href="/articles-cn" style="color:white; text-decoration:none; font-size:1.5rem;">簡體文章</a>
  <a href="mailto:amy@amyhorealestate.com" style="color:white; text-decoration:none; font-size:1.5rem;">聯絡我</a>
</div>

<header>
  <p style="color:var(--accent); letter-spacing:0.2em; font-size:0.7rem; margin-bottom:1rem;">BARFOOT & THOMPSON · PARNELL · AUCKLAND</p>
  <h1 class="hero-name">Amy Ho</h1>
  <p style="font-size:1.2rem; color:var(--muted); margin-bottom:2rem;">房產經紀人</p>
  <p class="hero-bio">深耕奧克蘭房產市場，專注服務華人買家與賣家。協助客戶在奧克蘭複雜的房市中做出清晰決策。</p>
</header>

<div class="article-grid">
  <a href="/articles-tw.html" class="article-card">
    <h3>繁體文章列表</h3>
    <p>市場動態、投資策略與生活指南</p>
  </a>
  <a href="/articles-cn" class="article-card">
    <h3>简体文章列表</h3>
    <p>奥克兰房产资讯與移民置业建议</p>
  </a>
</div>

<script>
  const btn = document.getElementById('menuBtn');
  const menu = document.getElementById('navMenu');
  const overlay = document.getElementById('navOverlay');

  btn.addEventListener('click', () => {
    menu.classList.toggle('open');
    overlay.classList.toggle('open');
  });

  overlay.addEventListener('click', () => {
    menu.classList.remove('open');
    overlay.classList.remove('open');
  });
</script>

</body>
</html>
